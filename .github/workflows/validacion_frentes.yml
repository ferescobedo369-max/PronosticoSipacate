name: Validacion Frentes Frios Sipacate

# VALIDACION: si hay senales de frente frio, envia el resumen SOLO a los chats personales
# del secret TELEGRAM_CHAT_ID; si no hay senales, no envia nada. Nunca guarda nada en el repo.
# Solo con emitir_grupo=1 (cuando el ICC lo autoriza) envia la alerta al grupo.
# Corre al subir cambios a la rama validacion-frentes, o cuando la tarea programada
# de Claude lo lanza cada manana (workflow_dispatch con ref=validacion-frentes).
on:
  push:
    branches: [validacion-frentes]
  workflow_dispatch:
    inputs:
      solo_mostrar:
        description: '1 = solo mostrar en el log, sin enviar a Telegram'
        required: false
        default: ''
      emitir_grupo:
        description: '1 = EMITIR la alerta de frente frio al grupo (solo cuando el ICC lo autoriza)'
        required: false
        default: ''

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias Python
        run: |
          pip install --upgrade pip
          pip install geopandas shapely numpy pandas requests matplotlib pillow deep-translator pypdf \
            openmeteo-requests requests-cache retry-requests cryptography

      - name: Enviar validacion a chat personal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENMETEO_APIKEY: ${{ secrets.OPENMETEO_APIKEY }}
          SOLO_MOSTRAR: ${{ inputs.solo_mostrar }}
          EMITIR_GRUPO: ${{ inputs.emitir_grupo }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python 8_Validacion_Frentes.py
