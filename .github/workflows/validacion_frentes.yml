name: Validacion Frentes Frios Sipacate

# SOLO VALIDACION: envia el resumen (modelo ECMWF + NOAA) unicamente a los chats
# personales del secret TELEGRAM_CHAT_ID. No envia al grupo ni guarda nada en el repo.
# Corre al subir cambios a la rama validacion-frentes, o cuando la tarea programada
# de Claude lo lanza cada manana (workflow_dispatch con ref=validacion-frentes).
on:
  push:
    branches: [validacion-frentes]
  workflow_dispatch:
    inputs:
      solo_mostrar:
        description: '1 = solo mostrar en el log, sin enviar a Telegram'
        required: false
        default: ''

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias Python
        run: |
          pip install --upgrade pip
          pip install geopandas shapely numpy pandas requests matplotlib pillow deep-translator pypdf \
            openmeteo-requests requests-cache retry-requests cryptography

      - name: Enviar validacion a chat personal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENMETEO_APIKEY: ${{ secrets.OPENMETEO_APIKEY }}
          SOLO_MOSTRAR: ${{ inputs.solo_mostrar }}
        run: python 8_Validacion_Frentes.py

      - name: Guardar imagenes para revision (solo en modo revision)
        if: ${{ inputs.solo_mostrar == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: imagenes-validacion
          path: _*.png
          retention-days: 3
