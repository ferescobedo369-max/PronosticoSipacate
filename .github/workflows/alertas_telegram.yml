name: Alertas Viento Telegram Sipacate

# Workflow SEPARADO del boletin: no toca 2_Results ni Power BI.
# En la rama de prueba corre cada vez que se sube un cambio a 'alertas'
# (GitHub solo muestra "Run workflow" para workflows que existen en main).
# Cuando se una a main, descomentar el schedule para que corra solo.
on:
  push:
    branches: [alertas]
  # schedule:
  #   # 5:30 AM Guatemala = 11:30 UTC (despues del boletin)
  #   - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias Python
        run: |
          pip install --upgrade pip
          pip install geopandas shapely numpy pandas requests \
            openmeteo-requests requests-cache retry-requests

      - name: Enviar alertas por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENMETEO_APIKEY: ${{ secrets.OPENMETEO_APIKEY }}
        run: python 6_Alertas_Telegram.py
